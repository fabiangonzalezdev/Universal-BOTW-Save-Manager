name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Tk and display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - name: UI smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python main.py --smoke-test
          xvfb-run -a python tests/gui_smoke.py
      - name: UI smoke test
        if: runner.os != 'Linux'
        run: |
          python main.py --smoke-test
          python tests/gui_smoke.py
      - run: python build.py
      - name: Verify packaged Windows resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\dist\Universal-BOTW-Save-Manager.exe' -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw 'Packaged self-test failed' }
      - name: Verify packaged Linux resources
        if: runner.os == 'Linux'
        run: ./dist/Universal-BOTW-Save-Manager --self-test
      - name: Package versioned release
        run: python package_release.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            releases/**/*.zip
            releases/**/*.sha256
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/**/*.zip
            release-assets/**/*.sha256
